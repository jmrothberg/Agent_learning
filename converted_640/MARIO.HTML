  if (left) col = cols - 1 - col;
  blit(img, col + Math.floor(frame / cols) * cols, cols, tw, th, dx, dy);
}
function drawTiles() {
  var i, sx, sy, frame;
  for (i = 0; i < TX.length; i++) {
    sx = TX[i] - camX;
    sy = TY[i] - camY;
    if (sx < -32 || sy < -40 || sx > 640 || sy > 480) continue;
    if (TB[i] > 2) sy -= 8;
    else if (TB[i]) sy -= 4;
    blit(sheetT, TF[i], 29, 32, 32, sx, sy);
  }
  for (i = 0; i < QX.length; i++) {
    sx = QX[i] - camX;
    sy = QY[i] - camY;
    if (sx < -32 || sy < -40 || sx > 640 || sy > 480) continue;
    frame = (QE[i] || QB[i]) ? 3 : QSEQ[Math.floor(tick / 8) % 6];
    if (QB[i] > 6) sy -= 8;
    else if (QB[i] > 3) sy -= 4;
    blit(sheetT, frame, 29, 32, 32, sx, sy);
  }
}
function drawActors() {
  var i, sx, sy, frame, img, left;
  var ci, dw, col, row;
  for (i = 0; i < 8; i++) {
    if (!NT[i] || !sheetT.complete) continue;
    ci = Math.floor((30 - NT[i]) / 3);
    if (ci > 9) ci = 9;
    dw = COINX[ci];
    col = COINF[ci] % 29;
    row = Math.floor(COINF[ci] / 29);
    ctx.drawImage(sheetT, col * 32, row * 32, 32, 32, NX[i] - camX + (32 - dw) / 2, NY[i] + COINY[ci] - camY, dw, 32);
  }
  for (i = 0; i < FX.length; i++) {
    if (!FST[i]) continue;
    sx = FX[i] - camX;
    sy = FY[i] - camY;
    if (sx < -32 || sx > 640) continue;
    if (FK[i]) frame = (FST[i] == 2) ? 10 : ((Math.floor(tick / 8) % 2) ? 7 : 6);
    else frame = (FST[i] == 2) ? 2 : (Math.floor(tick / 8) % 2);
    left = FVX[i] < 0;
    img = left ? sheetEL : sheetE;
    blitFace(img, frame, 51, 32, 64, sx, sy, left);
  }
  if (!(hurt && (Math.floor(tick / 4) % 2))) {
    frame = 21;
    if (!grounded) frame = 26;
    else if (vx) frame = WALK[Math.floor(tick / 6) % 4];
    img = face ? sheetM : sheetML;
    blitFace(img, frame, 21, 32, 64, px - camX, py - camY, face ? 0 : 1);
  }
}
function drawHud() {
  ctx.fillStyle = "#f8f8f8";
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText("SCORE", 16, 8);
  ctx.fillText(String(state.score), 112, 8);
  ctx.fillText("LIVES", 240, 8);
  ctx.fillText(String(state.lives), 336, 8);
  blit(sheetT, 52, 29, 32, 32, 420, 0);
  ctx.fillText(state.coins < 10 ? "x0" + state.coins : "x" + state.coins, 456, 8);
  if (state.mode == "win") ctx.fillText("GOAL", 16, 32);
  if (state.mode == "over") ctx.fillText("OVER", 16, 32);
}
function draw() {
  ctx.fillStyle = "#4242ff";
  ctx.fillRect(0, 0, 640, 480);
  drawTiles();
  drawActors();
  drawHud();
}
function loop() {
  tick += 1;
  step();
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
