function mkMon(x,y,boss){return{x:x,y:y,hp:boss?60:12,boss:boss,alive:true,atk:0,cool:0,anim:0};}

// raycast
function castRay(px,py,rdx,rdy,out){
var mx=px|0,my=py|0;
var ddx=rdx!==0?Math.abs(1/rdx):1e30;
var ddy=rdy!==0?Math.abs(1/rdy):1e30;
var stepX,stepY,sdx,sdy;
if(rdx<0){stepX=-1;sdx=(px-mx)*ddx;}else{stepX=1;sdx=(mx+1-px)*ddx;}

while(hit===0&&g++<160){
if(sdx<sdy){sdx+=ddx;mx+=stepX;side=0;}else{sdy+=ddy;my+=stepY;side=1;}
if(mx<0||my<0||mx>=MW||my>=MH){hit=2;break;}

wx-=Math.floor(wx);

var rayOut={dist:0,side:0,wx:0};
// fire hitscan
function fire(){
if(state.phase!=="play"||state.over)return;
if(state.fireCd>0)return;
var p=state.player;if(p.ammo<=0)return;
p.ammo--;state.muzzle=0.12;state.fireCd=0.32;sfxShoot();
var di=fi(p.yaw),dx=LC[di],dy=LS[di];
castRay(p.x,p.y,dx,dy,rayOut);var wallD=rayOut.dist;
var best=-1,bestD=1e9;
for(var i=0;i<state.monsters.length;i++){var m=state.monsters[i];if(!m.alive)continue;
var tx=m.x-p.x,ty=m.y-p.y;var fwd=tx*dx+ty*dy;if(fwd<0.2)continue;

}
if(best>=0){var mo=state.monsters[best];mo.hp-=12;mo.atk=0.15;sfxHit();
if(mo.hp<=0){mo.alive=false;state.score+=mo.boss?500:100;sfxBoom();}
}
}
function skip(){if(state.phase==="intro"||state.phase==="boss"){state.phase="play";}}
// update
function update(dt){
if(state.over)return;

if(keys.lk){mx2-=rx;my2-=ry;}

tryMove(p,mx2,my2);}

if(state.muzzle>0)state.muzzle-=dt;
if(state.hurt>0)state.hurt-=dt;
if(state.shake>0)state.shake-=dt;
if(state.phase!=="play")return;
// pickups
for(var j=0;j<state.pickups.length;j++){var pk=state.pickups[j];if(pk.got)continue;
var pdx=pk.x-p.x,pdy=pk.y-p.y;if(pdx*pdx+pdy*pdy<0.36){pk.got=true;sfxPick();

for(var i=0;i<state.monsters.length;i++){var m=state.monsters[i];if(!m.alive)continue;alive++;if(m.boss)bossLeft=m;
var tdx=p.x-m.x,tdy=p.y-m.y;var dd=Math.sqrt(tdx*tdx+tdy*tdy);

function tryMove(e,mvx,mvy){
var r=0.25;

// floor/ceil texture caster — same perspective sampling the wall columns use
var TPIX=64;
var fScr=ctx.createImageData(W,H);
var fBuf=new Uint32Array(fScr.data.buffer);
var tileCache=Object.create(null);
var gLX=0,gLY=0,gRDX=0,gRDY=0;
function getTileBuf(idx){

}catch(e){buf=null;}

}
function castRow(y,denom,src){
var row=y*W;

for(var x2=0;x2<W;x2++){
fBuf[row+x2]=src[((((fy*TPIX)|0)&63)*TPIX)+((((fx*TPIX)|0)&63))];
fx+=stepX;fy+=stepY;

}
function castFloorCeil(p,dx,dy,px,py,po){

var hor=H/2+po,y0=hor|0;
if(y0<0)y0=0;if(y0>H)y0=H;

for(var y=0;y<y0;y++){var dc=hor-y;if(dc<0.5)dc=0.5;castRow(y,dc,cb);}
for(var y2=y0;y2<H;y2++){var df=y2-hor;if(df<0.5)df=0.5;castRow(y2,df,fb);}

}
// render
function render(){
var p=state.player;
var di=fi(p.yaw),dx=LC[di],dy=LS[di];
var fov=0.66,planeX=-dy*fov,planeY=dx*fov;

var shx=state.shake>0?(Math.random()-0.5)*4:0;
for(var x=0;x<W;x++){
var camx=2*x/W-1;var rdx=dx+planeX*camx,rdy=dy+planeY*camx;
castRay(p.x,p.y,rdx,rdy,rayOut);
var dist=rayOut.dist;zbuf[x]=dist;

}
// sprites
var order=[];
for(var i=0;i<state.monsters.length;i++){var m=state.monsters[i];if(!m.alive)continue;
var tx=m.x-p.x,ty=m.y-p.y;order.push({m:m,d:tx*tx+ty*ty});}
for(var j=0;j<state.pickups.length;j++){var pk=state.pickups[j];if(pk.got)continue;
var qx=pk.x-p.x,qy=pk.y-p.y;order.push({p:pk,d:qx*qx+qy*qy});}
order.sort(function(a,b){return b.d-a.d;});
for(var k=0;k<order.length;k++){drawBillboard(order[k],dx,dy,planeX,planeY,pitchOff);}
// weapon
var wimg=state.muzzle>0?IMG[W_FIRE]:IMG[W_IDLE];

else if(state.phase==="boss")drawCut(IMG[C_BOSS],"THE BOSS AWAKENS","Click / Space to fight");
else if(state.phase==="win")drawEnd("LEVEL CLEARED","Score: "+state.score+"   Press R to restart");

}
function drawBillboard(o,dx,dy,px,py,po){
var e=o.m||o.p;var isMon=!!o.m;

var tX=inv*(dy*tx-dx*ty);
var tY=inv*(-py*tx+px*ty);
if(tY<0.15)return;
var scrX=(W/2)*(1+tX/tY);
var floorY=H/2+(H*0.5)/tY+po;
var scale=isMon?(e.boss?1.7:1.0):0.45;
var sh=(H/tY)*scale;var sw=sh;
var top=floorY-sh;var left=scrX-sw/2;
var img;
if(isMon){var atk=e.atk>0;img=e.boss?(atk?IMG[B_ATK]:IMG[B_IDLE]):(atk?IMG[M_ATK]:IMG[M_IDLE]);}
else{img=e.type==="hp"?IMG[P_HP]:IMG[P_AM];}
var x0=Math.floor(left);if(x0<0)x0=0;
var x1=Math.ceil(left+sw);if(x1>W)x1=W;
for(var x=x0;x<x1;x++){
if(tY>=zbuf[x])continue;
var col=(x-left)/sw;var sxx=(col*64)|0;if(sxx<0)sxx=0;if(sxx>63)sxx=63;
ctx.drawImage(img,sxx,0,1,64,x,top,1,sh);
}
}
function drawHUD(){
ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,H-40,W,40);
ctx.fillStyle="#e33";ctx.font="bold 22px monospace";ctx.fillText("HP "+state.player.hp,16,H-14);
ctx.fillStyle="#4e4";ctx.fillText("AMMO "+state.player.ammo,160,H-14);
ctx.fillStyle="#ee4";ctx.fillText("SCORE "+state.score,340,H-14);
var left=0;for(var i=0;i<state.monsters.length;i++)if(state.monsters[i].alive)left++;
ctx.fillStyle="#e9e";ctx.fillText("FOES "+left,500,H-14);
}
function drawMinimap(){
var s=4,mx=W-MW*s-8,my=8;
ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(mx-2,my-2,MW*s+4,MH*s+4);
for(var y=0;y<MH;y++)for(var x=0;x<MW;x++){if(MAP[y][x]>0){ctx.fillStyle="#556";ctx.fillRect(mx+x*s,my+y*s,s,s);}}
for(var i=0;i<state.monsters.length;i++){var m=state.monsters[i];if(!m.alive)continue;ctx.fillStyle=m.boss?"#f0f":"#f44";ctx.fillRect(mx+m.x*s-1,my+m.y*s-1,2,2);}
var p=state.player;ctx.fillStyle="#0f0";ctx.fillRect(mx+p.x*s-1,my+p.y*s-1,3,3);
}
function drawCut(img,title,sub){
ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
ctx.globalAlpha=0.9;ctx.drawImage(img,0,0,W,H);ctx.globalAlpha=1;
ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,H/2-40,W,90);
ctx.fillStyle="#fff";ctx.font="bold 34px monospace";ctx.textAlign="center";ctx.fillText(title,W/2,H/2);
ctx.fillStyle="#ccc";ctx.font="16px monospace";ctx.fillText(sub,W/2,H/2+28);ctx.textAlign="left";
}
function drawEnd(t1,t2){
ctx.fillStyle="rgba(0,0,0,0.75)";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#fff";ctx.font="bold 40px monospace";ctx.textAlign="center";ctx.fillText(t1,W/2,H/2-10);
ctx.fillStyle="#ccc";ctx.font="18px monospace";ctx.fillText(t2,W/2,H/2+30);ctx.textAlign="left";
}
// loop
var last=performance.now();
function frame(now){var dt=(now-last)/1000;if(dt>0.05)dt=0.05;last=now;
try{update(dt);render();}catch(err){}
requestAnimationFrame(frame);}
reset();
requestAnimationFrame(frame);
})();
</script>
</body></html>
