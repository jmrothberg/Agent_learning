<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Dig Dug</title>
<style>
  html,body { margin:0; background:#000; color:#fff; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { background:#2a1a0a; image-rendering:pixelated; }
</style></head>
<body>
<div id="wrap"><canvas id="c" width="640" height="480"></canvas></div>

<script data-host="chrome">
  window.JMR_SPR = ["DIGDUGDI-0.png", "DIGDUGDI-1.png", "DIGDUGDI-2.png"];
  (function(){
    var map = {"jmr:spr:0":"DIGDUGDI-0.png","jmr:spr:1":"DIGDUGDI-1.png","jmr:spr:2":"DIGDUGDI-2.png"};
    var orig = HTMLImageElement.prototype;
    var d = Object.getOwnPropertyDescriptor(orig,"src") || {};
    Object.defineProperty(orig,"src",{
      get:function(){ return d.get ? d.get.call(this) : this._jmr; },
      set:function(v){ if(map[v]) v=map[v]; this._jmr=v; if(d.set) d.set.call(this,v); else this.setAttribute("src",v); }
    });
  })();
</script>

<script data-host="chrome">
// PNG list make_artx.py reads. Index N is jmr:spr:N.
window.JMR_SPR = ["DIGDUGDI-0.png", "DIGDUGDI-1.png", "DIGDUGDI-2.png"];
(function () {
  var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
  Object.defineProperty(HTMLImageElement.prototype, "src", {
    get: function () { return d.get.call(this); },
    set: function (v) {
      var m = /^jmr:spr:(\d+)$/.exec(v);
      d.set.call(this, m ? window.JMR_SPR[+m[1]] : v);
    }
  });
  var list = window.JMR_SPR || [];
  var n = 0;
  var need = list.length;
  if (!need) { window._assetsReady = true; return; }
  var i = 0;
  while (i < need) {
    var im = new Image();
    im.onload = im.onerror = function () {
      n = n + 1;
      if (n >= need) window._assetsReady = true;
    };
    im.src = list[i];
    i = i + 1;
  }
})();
</script>
<script>
// JMR atlas helper — 9-arg crop; src literals only (no concat).
window.JMR_CELL = [[24,24], [24,24], [24,24]];
var S0 = new Image(); S0.src = "jmr:spr:0";
var S1 = new Image(); S1.src = "jmr:spr:1";
var S2 = new Image(); S2.src = "jmr:spr:2";
function blitSpr(c, img, fi, cw, ch, dx, dy) { c.drawImage(img, fi * cw, 0, cw, ch, dx, dy, cw, ch); }
</script>

<script>
(function(){
  var cvs = document.getElementById("c");
  var ctx = cvs.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var TILE = 32;
  var COLS = 20;
  var ROWS = 14;
  var HUD_H = 32;

  var S0 = new Image(); S0.src = "jmr:spr:0";
  var S1 = new Image(); S1.src = "jmr:spr:1";
  var S2 = new Image(); S2.src = "jmr:spr:2";

  function blitSpr(im, fi, cw, ch, x, y){
    ctx.drawImage(im, fi*cw, 0, cw, ch, x, y, cw, ch);
  }

  var state = {
    soil: [],
    player: { tx: 0, ty: 0, x: 0, y: 0, dir: 1, frame: 0, anim: 0, pump: 0 },
    monsters: [],
    rocks: [],
    harpoons: [],
    level: 1,
    score: 0,
    lives: 3,
    over: false,
    won: false
  };
  window.state = state;
  window.game = { reset: reset };

  var keys = { l:0, r:0, u:0, d:0, f:0 };

  function buildSoil(){
    state.soil = [];
    for (var r=0; r<ROWS; r++){
      var row = [];
      for (var c=0; c<COLS; c++) row.push(1);
      state.soil.push(row);
    }
    clearTunnels();
  }

  function clearTunnels(){
    for (var c=0; c<COLS; c++) state.soil[0][c] = 0;
    for (var r=0; r<ROWS; r++) state.soil[r][0] = 0;
    for (var r2=0; r2<ROWS; r2++) state.soil[r2][COLS-1] = 0;
    for (var c2=0; c2<COLS; c2++) state.soil[ROWS-1][c2] = 0;
  }

  function spawnMonsters(){
    state.monsters = [];
    var n = 3 + state.level;
    if (n > 8) n = 8;
    for (var i=0; i<n; i++){
      var side = i % 4;
      var tx, ty;
      if (side === 0){ tx = 0; ty = 1 + (i % (ROWS-2)); }
      else if (side === 1){ tx = COLS-1; ty = 1 + ((i+1) % (ROWS-2)); }
      else if (side === 2){ tx = 1 + (i % (COLS-2)); ty = 0; }
      else { tx = 1 + ((i+2) % (COLS-2)); ty = ROWS-1; }
      state.monsters.push({ tx: tx, ty: ty, x: tx*TILE, y: ty*TILE,
        dir: 1, frame: 0, anim: 0, inflate: 0, dead: 0, speed: 0.02 + state.level*0.003 });
    }
  }

  function reset(){
    state.level = 1;
    state.score = 0;
    state.lives = 3;
    state.over = false;
    state.won = false;
    state.rocks = [];
    state.harpoons = [];
    state.player.tx = 0; state.player.ty = 0;
    state.player.x = 0; state.player.y = 0;
    state.player.dir = 1; state.player.frame = 0; state.player.anim = 0; state.player.pump = 0;
    buildSoil();
    spawnMonsters();
  }

  function nextLevel(){
    state.level++;
    state.rocks = [];
    state.harpoons = [];
    state.player.tx = 0; state.player.ty = 0;
    state.player.x = 0; state.player.y = 0;
    state.player.dir = 1; state.player.frame = 0; state.player.anim = 0; state.player.pump = 0;
    buildSoil();
    spawnMonsters();
  }

  function isSoil(r,c){
    if (r<0||r>=ROWS||c<0||c>=COLS) return true;
    return state.soil[r][c] === 1;
  }

  function updatePlayer(){
    var p = state.player;
    var dx=0, dy=0;
    if (keys.l) dx=-1; else if (keys.r) dx=1; else if (keys.u) dy=-1; else if (keys.d) dy=1;
    if (dx!==0||dy!==0){
      p.dir = dx;
      var nt = p.tx + dx, nr = p.ty + dy;
      if (isSoil(nr,nt)){
        if (nr>=0&&nr<ROWS&&nt>=0&&nt<COLS) state.soil[nr][nt] = 0;
      }
      if (nt>=0&&nt<COLS&&nr>=0&&nr<ROWS) { p.tx=nt; p.ty=nr; }
      p.frame += 0.2;
      p.anim = 1;
    } else {
      p.anim = 0;
    }
    p.x = p.tx*TILE;
    p.y = p.ty*TILE;
    if (p.pump>0) p.pump--;
  }

  function fireHarpoon(){
    var p = state.player;
    if (p.pump>0) return;
    p.pump = 20;
    var dx = p.dir;
    var tx = p.tx + dx, ty = p.ty;
    if (isSoil(ty,tx)) return;
    state.harpoons.push({ tx: tx, ty: ty, x: tx*TILE, y: ty*TILE, dir: dx, life: 30 });
  }

  function updateHarpoons(){
    for (var i=0; i<state.harpoons.length; i++){
      var h = state.harpoons[i];
      h.life--;
      if (h.life<=0) continue;
      var nt = h.tx + h.dir, nr = h.ty;
      if (isSoil(nr,nt)){ h.life=0; continue; }
      h.tx=nt; h.ty=nr; h.x=nt*TILE; h.y=nr*TILE;
      for (var m=0; m<state.monsters.length; m++){
        var mo = state.monsters[m];
        if (mo.dead) continue;
        if (mo.tx===h.tx && mo.ty===h.ty){
          mo.inflate = 1;
          h.life = 0;
          break;
        }
      }
    }
    var w=0;
    for (var j=0; j<state.harpoons.length; j++){ if (state.harpoons[j].life>0){ state.harpoons[w]=state.harpoons[j]; w++; } }
    state.harpoons.length = w;
  }

  function updateMonsters(){
    for (var i=0; i<state.monsters.length; i++){
      var m = state.monsters[i];
      if (m.dead) continue;
      if (m.inflate){
        m.frame += 0.3;
        if (m.frame > 3){ m.dead = 1; state.score += 100; }
        continue;
      }
      m.frame += m.speed;
      var dx = m.dir;
      var nt = m.tx + dx, nr = m.ty;
      if (isSoil(nr,nt)){
        m.dir = -m.dir;
        nt = m.tx - m.dir;
      }
      if (nt<0||nt>=COLS){ m.dir=-m.dir; nt=m.tx+m.dir; }
      if (nt>=0&&nt<COLS) m.tx=nt;
      m.x = m.tx*TILE; m.y = m.ty*TILE;
      if (m.tx===state.player.tx && m.ty===state.player.ty){
        state.lives--;
        if (state.lives<=0){ state.over=true; }
        else { m.tx = 0; m.x=0; m.dir=1; }
      }
    }
    var w2=0;
    for (var j2=0; j2<state.monsters.length; j2++){ if (!state.monsters[j2].dead){ state.monsters[w2]=state.monsters[j2]; w2++; } }
    state.monsters.length = w2;
    if (state.monsters.length===0 && !state.over) nextLevel();
  }

  function updateRocks(){
    for (var i=0; i<state.rocks.length; i++){
      var rk = state.rocks[i];
      rk.y += 4;
      var r = Math.floor(rk.y / TILE);
      if (r>=ROWS){ rk.y = ROWS*TILE; rk.done=1; continue; }
      if (state.soil[r][rk.tx]===1){ rk.y = r*TILE; rk.done=1; continue; }
      for (var m=0; m<state.monsters.length; m++){
        var mo = state.monsters[m];
        if (mo.dead) continue;
        if (mo.tx===rk.tx && mo.ty===r){ mo.dead=1; state.score+=100; rk.done=1; break; }
      }
    }
    var w=0;
    for (var j=0; j<state.rocks.length; j++){ if (!state.rocks[j].done){ state.rocks[w]=state.rocks[j]; w++; } }
    state.rocks.length = w;
  }

  function dropRock(){
    var p = state.player;
    if (isSoil(p.ty, p.tx)) return;
    state.rocks.push({ tx: p.tx, x: p.tx*TILE, y: p.ty*TILE, done:0 });
  }

  function update(){
    if (state.over) return;
    updatePlayer();
    if (keys.f) { fireHarpoon(); keys.f=0; }
    updateHarpoons();
    updateMonsters();
    updateRocks();
  }

  function soilColor(r){
    if (r<3) return "#8a5a2b";
    if (r<6) return "#6e4420";
    if (r<9) return "#54331a";
    return "#3a2414";
  }

  function drawSoil(){
    for (var r=0; r<ROWS; r++){
      for (var c=0; c<COLS; c++){
        if (state.soil[r][c]===1){
          ctx.fillStyle = soilColor(r);
          ctx.fillRect(c*TILE, HUD_H + r*TILE, TILE, TILE);
          ctx.fillStyle = "#000000";
          ctx.fillRect(c*TILE, HUD_H + r*TILE, TILE, 2);
          ctx.fillRect(c*TILE, HUD_H + r*TILE, 2, TILE);
        }
      }
    }
  }

  function drawPlayer(){
    var p = state.player;
    var x = p.x, y = HUD_H + p.y;
    if (p.pump>0) blitSpr(S0, 2, 24, 24, x+4, y+4);
    else if (p.anim) blitSpr(S0, 1, 24, 24, x+4, y+4);
    else blitSpr(S0, 0, 24, 24, x+4, y+4);
  }

  function drawMonsters(){
    for (var i=0; i<state.monsters.length; i++){
      var m = state.monsters[i];
      var x = m.x, y = HUD_H + m.y;
      if (m.inflate) blitSpr(S1, 2, 24, 24, x+4, y+4);
      else blitSpr(S1, 0, 24, 24, x+4, y+4);
    }
  }

  function drawRocks(){
    for (var i=0; i<state.rocks.length; i++){
      var rk = state.rocks[i];
      blitSpr(S2, 0, 24, 24, rk.x+4, rk.y+4);
    }
  }

  function drawHarpoons(){
    for (var i=0; i<state.harpoons.length; i++){
      var h = state.harpoons[i];
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(h.x+12, HUD_H+h.y+14, 8, 4);
    }
  }

  function drawHUD(){
    ctx.fillStyle = "#000000";
    ctx.fillRect(0,0,640,HUD_H);
    ctx.fillStyle = "#ffff00";
    ctx.font = "16px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE", 10, 22);
    ctx.fillText(String(state.score), 90, 22);
    ctx.fillStyle = "#00ff00";
    ctx.fillText("LEVEL", 250, 22);
    ctx.fillText(String(state.level), 320, 22);
    ctx.fillStyle = "#ff4040";
    ctx.fillText("LIVES", 430, 22);
    for (var i=0; i<state.lives; i++) ctx.fillRect(500+i*14, 10, 10, 12);
  }

  function drawOver(){
    ctx.fillStyle = "#000000";
    ctx.fillRect(0,0,640,480);
    ctx.fillStyle = "#ff4040";
    ctx.font = "32px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 320, 220);
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px monospace";
    ctx.fillText("PRESS R TO RESTART", 320, 260);
  }

  function draw(){
    ctx.fillStyle = "#2a1a0a";
    ctx.fillRect(0,0,640,480);
    if (state.over){ drawOver(); return; }
    drawSoil();
    drawRocks();
    drawHarpoons();
    drawMonsters();
    drawPlayer();
    drawHUD();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  addEventListener("keydown", function(e){
    var k = e.key;
    var code = e.keyCode;
    if (k==="ArrowLeft"||code===37) keys.l=1;
    else if (k==="ArrowRight"||code===39) keys.r=1;
    else if (k==="ArrowUp"||code===38) keys.u=1;
    else if (k==="ArrowDown"||code===40) keys.d=1;
    else if (k===" "||code===32) keys.f=1;
    else if (k==="r"||k==="R"||code===82) reset();
  });
  addEventListener("keyup", function(e){
    var k = e.key;
    var code = e.keyCode;
    if (k==="ArrowLeft"||code===37) keys.l=0;
    else if (k==="ArrowRight"||code===39) keys.r=0;
    else if (k==="ArrowUp"||code===38) keys.u=0;
    else if (k==="ArrowDown"||code===40) keys.d=0;
    else if (k===" "||code===32) keys.f=0;
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body></html>
